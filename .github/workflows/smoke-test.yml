name: Emulator smoke test

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 34, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify signature
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.superzeka.kolaj/.MainActivity
            sleep 8
            adb logcat -d -s AndroidRuntime:E ActivityManager:* | tail -60
            adb shell pidof com.superzeka.kolaj
            adb shell dumpsys activity activities | grep -i "superzeka" | head -5
            adb exec-out screencap -p > screen-${{ matrix.api-level }}.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-${{ matrix.api-level }}
          path: screen-*.png
