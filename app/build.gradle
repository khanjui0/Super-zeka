plugins {
    id 'com.android.application'
}

android {
    namespace 'com.superzeka.kolaj'
    compileSdk 35

    defaultConfig {
        applicationId 'com.superzeka.kolaj'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Uses the debug key so the APK installs directly without a separate keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
